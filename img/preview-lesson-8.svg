<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <pattern id="grid8" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#d6d1c4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="480" height="270" fill="#fbf9f4" />
  <rect width="480" height="270" fill="url(#grid8)" />

  <!-- Left Card: HTML5 Video Player Window -->
  <g transform="translate(26, 26)">
    <rect x="5" y="5" width="240" height="162" rx="8" fill="#111318" />
    <rect width="240" height="162" rx="8" fill="#0f172a" stroke="#111318" stroke-width="3" />
    <!-- Top Chrome -->
    <rect width="240" height="28" rx="8" fill="#7c3aed" stroke="#111318" stroke-width="3" />
    <circle cx="15" cy="14" r="4" fill="#ff4732" stroke="#111318" stroke-width="1.5" />
    <circle cx="29" cy="14" r="4" fill="#facc15" stroke="#111318" stroke-width="1.5" />
    <circle cx="43" cy="14" r="4" fill="#10b981" stroke="#111318" stroke-width="1.5" />
    <text x="145" y="18" font-family="monospace" font-weight="900" font-size="10" text-anchor="middle" fill="#ffffff">&lt;video controls&gt;</text>

    <!-- Video Viewport & Play Button -->
    <rect x="14" y="38" width="212" height="84" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <circle cx="120" cy="80" r="22" fill="#ff4732" stroke="#ffffff" stroke-width="2.5" />
    <polygon points="114,69 114,91 132,80" fill="#ffffff" />

    <!-- Subtitles CC Badge -->
    <rect x="184" y="46" width="34" height="18" rx="3" fill="#facc15" stroke="#111318" stroke-width="1.5" />
    <text x="201" y="59" font-family="monospace" font-weight="900" font-size="9" text-anchor="middle" fill="#111318">CC</text>

    <!-- Player Timeline Scrubber -->
    <rect x="14" y="132" width="212" height="8" rx="4" fill="#334155" />
    <rect x="14" y="132" width="128" height="8" rx="4" fill="#10b981" />
    <circle cx="142" cy="136" r="6" fill="#facc15" stroke="#111318" stroke-width="2" />
    <text x="14" y="153" font-family="monospace" font-weight="700" font-size="9" fill="#94a3b8">01:24 / 02:45 · WebM (VP9)</text>
  </g>

  <!-- Right Card: Audio Equalizer & MIME Stack -->
  <g transform="translate(284, 26)">
    <rect x="5" y="5" width="170" height="162" rx="8" fill="#111318" />
    <rect width="170" height="162" rx="8" fill="#ffffff" stroke="#111318" stroke-width="3" />
    <rect width="170" height="28" rx="8" fill="#facc15" stroke="#111318" stroke-width="3" />
    <text x="85" y="18" font-family="sans-serif" font-weight="900" font-size="10" text-anchor="middle" fill="#111318">AUDIO &amp; MIME TYPES</text>

    <!-- Audio Waveform Bars -->
    <g transform="translate(18, 42)">
      <rect x="0" y="24" width="10" height="24" rx="2" fill="#2563eb" stroke="#111318" stroke-width="1.5" />
      <rect x="15" y="10" width="10" height="38" rx="2" fill="#7c3aed" stroke="#111318" stroke-width="1.5" />
      <rect x="30" y="2" width="10" height="46" rx="2" fill="#ff4732" stroke="#111318" stroke-width="1.5" />
      <rect x="45" y="16" width="10" height="32" rx="2" fill="#10b981" stroke="#111318" stroke-width="1.5" />
      <rect x="60" y="6" width="10" height="42" rx="2" fill="#facc15" stroke="#111318" stroke-width="1.5" />
      <rect x="75" y="18" width="10" height="30" rx="2" fill="#2563eb" stroke="#111318" stroke-width="1.5" />
      <rect x="90" y="4" width="10" height="44" rx="2" fill="#ff4732" stroke="#111318" stroke-width="1.5" />
      <rect x="105" y="14" width="10" height="34" rx="2" fill="#10b981" stroke="#111318" stroke-width="1.5" />
      <rect x="120" y="22" width="10" height="26" rx="2" fill="#7c3aed" stroke="#111318" stroke-width="1.5" />
    </g>

    <!-- MIME Pills -->
    <rect x="16" y="100" width="138" height="22" rx="4" fill="#eff6ff" stroke="#111318" stroke-width="2" />
    <text x="85" y="115" font-family="monospace" font-weight="800" font-size="10" text-anchor="middle" fill="#1d4ed8">video/webm · AV1</text>

    <rect x="16" y="128" width="138" height="22" rx="4" fill="#ecfdf5" stroke="#111318" stroke-width="2" />
    <text x="85" y="143" font-family="monospace" font-weight="800" font-size="10" text-anchor="middle" fill="#047857">audio/ogg · Opus</text>
  </g>

  <!-- Bottom Banner: HTML5 Semantic Media Bar -->
  <g transform="translate(26, 206)">
    <rect x="4" y="4" width="428" height="42" rx="6" fill="#111318" />
    <rect width="428" height="42" rx="6" fill="#10b981" stroke="#111318" stroke-width="3" />
    <text x="214" y="26" font-family="monospace" font-weight="900" font-size="13" text-anchor="middle" fill="#111318">&lt;video&gt; · &lt;audio&gt; · &lt;source&gt; · &lt;track&gt; · MIME</text>
  </g>
</svg>
