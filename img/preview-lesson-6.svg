<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>
    <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.7" opacity="0.35"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" fill="url(#bgGrad)" rx="8"/>
  <rect width="400" height="240" fill="url(#gridPattern)" rx="8"/>
  <rect x="2" y="2" width="396" height="236" fill="none" stroke="#3b82f6" stroke-width="2" rx="7" opacity="0.4"/>

  <!-- Top bar with badges -->
  <rect x="18" y="16" width="76" height="24" rx="4" fill="#3b82f6" filter="url(#shadow)"/>
  <text x="56" y="32" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">УРОК 06</text>

  <rect x="102" y="16" width="136" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="170" y="32" fill="#38bdf8" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">@supports &amp; prefixes</text>

  <rect x="246" y="16" width="136" height="24" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="314" y="32" fill="#34d399" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">⚡ 99 LIGHTHOUSE</text>

  <!-- Browser Engines Badges Group -->
  <g transform="translate(18, 56)">
    <!-- Chrome / Blink -->
    <g transform="translate(0, 0)">
      <rect width="112" height="48" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
      <circle cx="20" cy="24" r="10" fill="#f59e0b" opacity="0.2"/>
      <text x="20" y="28" fill="#f59e0b" font-family="sans-serif" font-size="13" text-anchor="middle">⚡</text>
      <text x="36" y="20" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">BLINK</text>
      <text x="36" y="34" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="9">Chrome · Edge</text>
    </g>

    <!-- WebKit / Safari -->
    <g transform="translate(126, 0)">
      <rect width="112" height="48" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
      <circle cx="20" cy="24" r="10" fill="#38bdf8" opacity="0.2"/>
      <text x="20" y="28" fill="#38bdf8" font-family="sans-serif" font-size="13" text-anchor="middle">🧭</text>
      <text x="36" y="20" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">WEBKIT</text>
      <text x="36" y="34" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="9">Safari · iOS</text>
    </g>

    <!-- Gecko / Firefox -->
    <g transform="translate(252, 0)">
      <rect width="112" height="48" rx="6" fill="#1e293b" stroke="#fb7185" stroke-width="2" filter="url(#shadow)"/>
      <circle cx="20" cy="24" r="10" fill="#fb7185" opacity="0.2"/>
      <text x="20" y="28" fill="#fb7185" font-family="sans-serif" font-size="13" text-anchor="middle">🦊</text>
      <text x="36" y="20" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">GECKO</text>
      <text x="36" y="34" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="9">Firefox · Mozilla</text>
    </g>
  </g>

  <!-- Speedometer & Optimization stats card -->
  <g transform="translate(18, 118)">
    <rect width="364" height="66" rx="8" fill="#0b1329" stroke="#334155" stroke-width="1.5"/>

    <!-- Score Circle Gauge -->
    <g transform="translate(42, 33)">
      <circle cx="0" cy="0" r="24" fill="none" stroke="#1e293b" stroke-width="5"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="url(#scoreGrad)" stroke-width="5"
              stroke-dasharray="150" stroke-dashoffset="15" stroke-linecap="round" transform="rotate(-90)"/>
      <text x="0" y="6" fill="#22c55e" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" text-anchor="middle">98</text>
    </g>

    <!-- Metrics Column -->
    <text x="82" y="26" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">Оптимізація та Швидкодія</text>
    <text x="82" y="44" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10">WebP 150KB <tspan fill="#22c55e">(-85%)</tspan> · defer scripts · lazy</text>

    <!-- Prefix tag pills -->
    <rect x="82" y="49" width="58" height="13" rx="3" fill="#1e293b"/>
    <text x="111" y="59" fill="#93c5fd" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="middle">-webkit-</text>

    <rect x="146" y="49" width="50" height="13" rx="3" fill="#1e293b"/>
    <text x="171" y="59" fill="#93c5fd" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="middle">-moz-</text>

    <rect x="202" y="49" width="60" height="13" rx="3" fill="#1e293b"/>
    <text x="232" y="59" fill="#86efac" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="middle">Normalize</text>

    <!-- Speed pill right -->
    <rect x="286" y="16" width="66" height="34" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
    <text x="319" y="30" fill="#86efac" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" text-anchor="middle">4G SPEED</text>
    <text x="319" y="44" fill="#ffffff" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">0.45s ⚡</text>
  </g>

  <!-- Bottom title bar -->
  <text x="200" y="214" fill="#f8fafc" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    КРОСБРАУЗЕРНІСТЬ ТА ОПТИМІЗАЦІЯ САЙТІВ
  </text>
  <rect x="18" y="228" width="364" height="4" rx="2" fill="url(#accentGrad)"/>
</svg>
